name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - run: julia --startup-file=no -e 'using Pkg; env = joinpath(DEPOT_PATH[1], "environments", "better-pluto-client"); Pkg.activate(env); Pkg.add(name="Pluto", version="1"); Pkg.precompile()'
      - run: yarn package
      - run: julia --startup-file=no scripts/prepare-pluto-samples.jl
        env:
          JULIA_NUM_PRECOMPILE_TASKS: '1'
      # Runs type checks, development builds and lint via the pretest script.
      - run: xvfb-run -a yarn test
        env:
          RUN_PLUTO_E2E: '1'
