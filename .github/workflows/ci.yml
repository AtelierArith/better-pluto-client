name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn package
      # Runs type checks, development builds and lint via the pretest script.
      # Julia-backed integration tests remain opt-in (RUN_PLUTO_E2E=1).
      - run: xvfb-run -a yarn test
